[build-system]
requires = ["setuptools>=64", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "stambient"
version = "0.1.0"
description = "SPARKLE: Spatial Ambient RNA Kernel-based Leakage Estimator"
readme = "README.md"
requires-python = ">=3.9"
license = {text = "MIT"}
dependencies = [
    "numpy>=1.21",
    "scipy>=1.7",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "matplotlib>=3.5",
    "anndata>=0.8",
    "scanpy>=1.9",
    "scikit-learn>=1.0",
    "pandas>=1.3",
    "h5py>=3.0",
    "scib-metrics>=0.3",
    "scrublet>=0.2.3",
    "decontx-python>=0.2.0",
    "leidenalg>=0.8.0",
    "soupx-python>=0.3.0",
    "pysctransform>=0.1",
    "psutil>=5.9",
]
gpu = [
    "torch>=2.0",
]
all = [
    "stambient[dev,gpu]",
]

[tool.setuptools]
packages = ["stambient"]

[tool.pytest.ini_options]
testpaths = ["tests"]
