[build-system]
requires = ["setuptools>=77.0.3", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "stambient"
version = "0.1.3"
description = "Evidence-constrained correction of local RNA leakage in high-resolution spatial transcriptomics"
readme = {file = "README.md", content-type = "text/markdown"}
requires-python = ">=3.9"
license = "MIT"
license-files = ["LICENSE"]
keywords = [
    "spatial transcriptomics",
    "ambient RNA",
    "RNA leakage",
    "decontamination",
    "bioinformatics",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Bio-Informatics",
]
dependencies = [
    "numpy>=1.21",
    "scipy>=1.7",
]

[project.urls]
Homepage = "https://github.com/WangShuai-3/SPARKLE"
Repository = "https://github.com/WangShuai-3/SPARKLE"
Issues = "https://github.com/WangShuai-3/SPARKLE/issues"

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "matplotlib>=3.5",
    "anndata>=0.8",
    "scanpy>=1.9",
    "scikit-learn>=1.0",
    "pandas>=1.3",
    "h5py>=3.0",
    "scib-metrics>=0.3",
    "scrublet>=0.2.3",
    "decontx-python>=0.2.0",
    "leidenalg>=0.8.0",
    "soupx-python>=0.3.0",
    "pysctransform>=0.1",
    "psutil>=5.9",
]
gpu = [
    "torch>=2.0",
]

[tool.setuptools]
packages = ["stambient"]
include-package-data = false

[tool.pytest.ini_options]
testpaths = ["tests"]
